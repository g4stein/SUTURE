name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: licenses · typecheck · test · build · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: License audit
        run: pnpm run licenses

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit, integration, and property tests (real engines)
        run: pnpm test

      - name: Production build
        run: pnpm build

      # Spec 02 Req 10.2: main-thread JavaScript <= 350 kB gzip (workers excluded). Fails the build when exceeded.
      - name: Main bundle budget
        run: pnpm run budget

      # Spec 05 task 3.5: pack @g4stein/suture-mcp, npm-install the tarball outside the repo, and run the installed bin.
      - name: MCP package tarball smoke test
        run: pnpm --filter @g4stein/suture-mcp test:pack

      - name: Install Playwright browsers (Chromium, WebKit, Firefox)
        run: pnpm --filter @suture/web exec playwright install --with-deps chromium webkit firefox

      - name: End-to-end tests
        run: pnpm --filter @suture/web test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            packages/web/playwright-report
            packages/web/test-results
          retention-days: 7
          if-no-files-found: ignore
